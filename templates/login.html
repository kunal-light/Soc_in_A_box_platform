<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SOC-in-a-Box | Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-card {
            width: 420px;
            background: #1e293b;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 45px;
            color: #3b82f6;
        }

        .logo h2 {
            margin-top: 10px;
            font-weight: 700;
        }

        .form-control {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
        }

        .form-control:focus {
            background: #0f172a;
            color: white;
            border-color: #3b82f6;
            box-shadow: none;
        }

        .btn-login {
            width: 100%;
            background: #2563eb;
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

        <h2>SOC-in-a-Box</h2>

        <p class="text-secondary">
            Administrator Login
        </p>

    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                required
                autofocus
            >

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary btn-login"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>

</div>

</body>
</html>
